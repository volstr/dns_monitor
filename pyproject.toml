[project]
name = "dns-monitoring"
version = "0.1.0"
description = "DNS monitoring — наблюдение за адресами доменов"
requires-python = "==3.12.*"
# Диапазоны — здесь, точные версии — в uv.lock.
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
    "dnspython>=2.7,<3",
    "pyotp>=2.9,<3",
    "sentry-sdk>=2.19,<3",
    "gunicorn>=23,<25",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.9,<5",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["guide", "apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "PT", "RUF"]
# RUF001–RUF003: кириллица в строках и комментариях — норма для русского интерфейса.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
files = [
    "config/env.py",
    "core",
    "apps/*/services",
    "apps/*/selectors",
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
# --ds, а не DJANGO_SETTINGS_MODULE: переменная из .env иначе перебила бы тестовые настройки.
addopts = "--ds=config.settings.test --strict-markers"
testpaths = ["tests"]
