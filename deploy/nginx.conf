# nginx боевой установки — отдаёт статику, остальное проксирует на gunicorn.
#
# Зачем он вообще: при `DEBUG=False` Django статику не отдаёт, и это не упущение, а разделение
# обязанностей. gunicorn на отдаче файлов занимает рабочий процесс целиком, поэтому один
# медленный клиент, тянущий шрифт, стоит одного запроса к приложению.

# ── Чужой прокси перед нами ────────────────────────────────────────────────────
#
# Установку часто ставят за ещё один nginx, Nginx Proxy Manager, Traefik или балансир
# хостинга. Тогда до нас доходит адрес **прокси**, а не человека, и заголовкам `X-Forwarded-*`
# от него верить нужно — но только от него.
#
# Доверяем частным диапазонам: прокси на том же хосте или в соседней сети Docker попадает в
# них, а клиент из интернета — нет. Запрос с публичного адреса приходит напрямую, и его
# `X-Forwarded-For` игнорируется: иначе любой желающий подменял бы себе адрес и обходил счётчик
# неудачных входов (11.11). Свой прокси с публичным адресом — допишите его сюда.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
# Цепочку разбираем справа налево, пропуская доверенные: при двух прокси подряд левее них
# стоит настоящий клиент.
real_ip_recursive on;

# Схема запроса. Внешний прокси завершает TLS и шлёт нам обычный http, поэтому `$scheme` здесь
# всегда `http` — и если подставлять его, Django решит, что соединение незащищённое: защищённые
# куки не поставятся даже при настоящем HTTPS снаружи.
#
# Поэтому значение внешнего прокси проходит насквозь, но принимается **только от доверенного
# адреса**. `$realip_remote_addr` — тот, кто подключился на самом деле, до подстановки выше.
geo $realip_remote_addr $trusted_proxy {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}
map "$trusted_proxy:$http_x_forwarded_proto" $client_proto {
    default    $scheme;
    "1:https"  https;
    "1:http"   http;
}

server {
    listen 80;

    # Имя `web` разрешается **на каждый запрос**, а не один раз при старте. Это не
    # перестраховка: nginx запоминает адрес контейнера навсегда, а `docker compose up` при
    # обновлении создаёт контейнер заново и выдаёт ему новый адрес. Со статическим upstream
    # установка после каждого развёртывания отвечала бы `502 Bad Gateway`, пока кто-нибудь не
    # догадается перезапустить ещё и nginx.
    #
    # 127.0.0.11 — встроенный DNS Docker, он есть в любой сети компоуза.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://web:8000;
    # Под каким именем отвечать, решает ALLOWED_HOSTS приложения: дублировать перечень здесь
    # значит завести второе место, где его правят, и однажды они разойдутся.
    server_name _;

    # Импорт списком (ТЗ 10.3) принимает файл. Значение по умолчанию — 1 МБ, а список на
    # тысячу доменов с комментариями в него уже не помещается.
    client_max_body_size 5m;

    # Адрес и схема клиента. Без них Django видит запрос как пришедший от nginx по http:
    # ссылки в письмах станут http, а счётчик неудачных входов (11.11) начнёт считать всем
    # один общий адрес — то есть блокировать всех сразу.
    #
    # `X-Real-IP` здесь **перезаписывается всегда**, и на этом держится доверие к нему в
    # приложении: присланное клиентом значение до gunicorn не доходит. Условие — порта наружу
    # у `web` нет, то есть мимо nginx к нему не подключиться.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;

    # Браузер спрашивает значок в корне сайта, не зная ни про `/static/`, ни про шаблоны.
    # Без этой строки запрос ушёл бы в приложение и вернул 404 — а в журнале `web` на каждое
    # открытие вкладки появлялась бы запись о ненайденной странице.
    location = /favicon.ico {
        alias /srv/static/favicon.ico;
        expires 30d;
        access_log off;
        # Значок не трагедия: пока `collectstatic` не отработал, его просто нет.
        log_not_found off;
    }

    location /static/ {
        alias /srv/static/;
        # Имена файлов не версионируются, поэтому «навсегда» кэшировать нельзя: после
        # обновления браузер держал бы старый CSS. Сутки — разумная середина.
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        # Адрес собран из переменной, поэтому путь дописывается явно: при переменной в
        # `proxy_pass` nginx не подставляет его сам.
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        # Проверка домена вручную (11.6) ждёт ответа DNS-серверов: 60 секунд по умолчанию
        # могут не хватить, если сервер молчит и идёт перебор.
        proxy_read_timeout 120s;
    }
}

# TLS здесь намеренно не настроен. Сертификаты выпускает и продлевает установка, а не
# репозиторий: захардкодить пути к чужим файлам значит сделать компоуз неподнимаемым у всех,
# кроме одного. Когда сертификаты появятся — добавьте второй `server` на 443 и оставьте на 80
# только перенаправление. После этого APP_BASE_URL начинается с https://, и приложение само
# включает защищённые куки (config/settings/prod.py).
